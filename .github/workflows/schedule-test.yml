
name: Schedule trigger diagnostic

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Print event and UTC time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Repository: ${{ github.repository }}"
